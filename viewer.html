<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadLens Pro — ビューア</title>
  <meta name="description" content="ReadLens Pro — 共通テスト英語リーディング問題ビューア">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body class="viewer-body">

  <!-- Top nav bar -->
  <header class="viewer-header">
    <a href="index.html" class="viewer-back" title="一覧に戻る">← 一覧</a>
    <div class="viewer-title" id="viewer-title">読み込み中...</div>
    <div class="viewer-controls">
      <button class="btn-icon btn-fullscreen" id="btn-fullscreen" title="全画面表示">⛶</button>
      <button class="btn-icon btn-reset" id="btn-reset" title="リセット">↺</button>
      <button class="btn-icon" id="btn-toggle-ja" title="和訳を表示/非表示">訳</button>
      <button class="btn-icon" id="btn-toggle-evidence" title="根拠ハイライトを表示/非表示">根</button>
      <button class="btn-icon" id="btn-toggle-explain" title="解説を表示/非表示">解</button>
      <span class="viewer-controls-sep"></span>
      <button class="btn-icon btn-print" id="btn-print-passage" title="問題を印刷">📄</button>
      <button class="btn-icon btn-print" id="btn-print-questions" title="設問を印刷">📝</button>
    </div>
  </header>

  <!-- Split pane layout -->
  <main class="viewer-split">
    <!-- Left pane: Passage -->
    <section class="pane pane-left" id="pane-passage">
      <div class="pane-inner" id="passage-content">
        <p class="pane-loading">読み込み中...</p>
      </div>
    </section>

    <!-- Draggable divider -->
    <div class="pane-divider" id="pane-divider"></div>

    <!-- Right pane: Questions -->
    <section class="pane pane-right" id="pane-questions">
      <div class="pane-inner" id="questions-content">
        <p class="pane-loading">読み込み中...</p>
      </div>
    </section>
  </main>

  <!-- Audio seek bar (fixed footer) -->
  <div class="audio-bar" id="audio-bar">
    <button class="audio-bar-btn" id="audio-bar-playpause" title="再生/一時停止">⏸</button>
    <span class="audio-bar-time" id="audio-bar-current">0:00</span>
    <input class="audio-bar-seek" id="audio-bar-seek" type="range" min="0" max="100" value="0" step="0.1">
    <span class="audio-bar-time" id="audio-bar-total">0:00</span>
    <button class="audio-bar-btn" id="audio-bar-speed" title="再生速度: 標準">1.0x</button>
    <button class="audio-bar-btn audio-bar-close" id="audio-bar-close" title="閉じる">✕</button>
  </div>

  <!-- Scripts -->
  <script src="viewer.js?v=20260507.6"></script>
</body>
</html>
